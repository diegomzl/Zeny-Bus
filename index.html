<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07070c">
<title>Zeny Bus — Controle de Flips</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#07070c;
    --bg2:#0d0d16;
    --panel:#111119;
    --surface: rgba(255,255,255,.04);
    --surface2: rgba(255,255,255,.075);
    --border: rgba(255,255,255,.09);
    --border-strong: rgba(255,255,255,.18);
    --text:#f2f2f6;
    --text-dim:#a3a3b8;
    --text-mute:#6f6f85;
    --violet:#8b5cf6;
    --cyan:#22d3ee;
    --pink:#f472b6;
    --green:#34d399;
    --red:#fb7185;
    --amber:#fbbf24;
    --radius:20px;
    --radius-sm:12px;
    --shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    color-scheme:dark;
  }
  .blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.30;mix-blend-mode:screen;animation:float 24s ease-in-out infinite alternate;}
  .blob-a{width:520px;height:520px;top:-160px;left:-120px;background:radial-gradient(circle,var(--violet),transparent 70%);}
  .blob-b{width:480px;height:480px;bottom:-160px;right:-100px;background:radial-gradient(circle,var(--cyan),transparent 70%);animation-delay:-8s;}
  .blob-c{width:380px;height:380px;top:38%;left:48%;background:radial-gradient(circle,var(--pink),transparent 70%);animation-delay:-14s;opacity:.16;}
  @keyframes float{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,-30px) scale(1.08);}}

  .topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:22px 40px;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
  .brand-title{font-weight:800;font-size:20px;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#c7c7e0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand-sub{font-size:12px;color:var(--text-mute);margin-top:1px;}
  .header-actions{display:flex;gap:10px;align-items:center;}
  .lang-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
  .lang-btn{font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--text-mute);background:transparent;border:none;border-radius:7px;padding:7px 10px;cursor:pointer;transition:all .15s ease;}
  .lang-btn:hover{color:var(--text-dim);}
  .lang-btn.active{background:linear-gradient(135deg,var(--violet),var(--cyan));color:#0a0a12;}

  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding:20px;}
  .auth-card{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius);padding:36px 32px;width:380px;max-width:100%;box-shadow:var(--shadow);animation:pop .25s ease;}
  .auth-card h1{font-size:20px;font-weight:800;margin:0 0 6px;}
  .auth-card .auth-sub{font-size:13px;color:var(--text-mute);margin-bottom:24px;}
  .auth-card .field{margin-bottom:14px;}
  .auth-error{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);color:var(--red);font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  .auth-card .btn-primary{width:100%;justify-content:center;margin-top:6px;padding:12px;}
  .cloud-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-mute);}
  .cloud-status .dot{width:7px;height:7px;border-radius:50%;background:var(--text-mute);}
  .cloud-status.syncing .dot{background:var(--amber);animation:pulse 1s ease infinite;}
  .cloud-status.synced .dot{background:var(--green);}
  .cloud-status.error .dot{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .admin-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(34,211,238,.09));border:1px solid rgba(139,92,246,.35);border-radius:14px;padding:12px 18px;margin-bottom:20px;font-size:13.5px;}
  .user-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;}
  .user-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .user-row .u-name{font-weight:700;font-size:13.5px;}
  .user-row .u-email{font-size:12px;color:var(--text-mute);}
  .user-row .u-badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(139,92,246,.15);color:var(--violet);margin-left:6px;}
  .user-row .u-actions{display:flex;gap:6px;flex-shrink:0;}

  .btn{font-family:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 16px;cursor:pointer;transition:all .18s ease;display:inline-flex;align-items:center;gap:8px;}
  .btn:hover{background:var(--surface2);border-color:var(--border-strong);transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,var(--violet),var(--cyan));border:none;color:#0a0a12;font-weight:700;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-danger{color:var(--red);border-color:rgba(251,113,133,.3);}
  .btn-danger:hover{background:rgba(251,113,133,.1);}
  .btn-ghost{background:transparent;}
  .btn-icon{padding:8px;border-radius:10px;}
  .btn-sm{padding:6px 10px;font-size:13px;}

  main#app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:10px 40px 80px;animation:fadeIn .5s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 20px;backdrop-filter:blur(20px);}
  .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-mute);font-weight:600;}
  .stat-value{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}
  .stat-value.green{color:var(--green);}
  .stat-value.amber{color:var(--amber);}
  .stat-sub{font-size:12px;color:var(--text-mute);margin-top:4px;font-family:'JetBrains Mono',ui-monospace,monospace;}
  .usd-inline{color:var(--text-mute);font-weight:600;font-size:.9em;}
  .zeny-unit{color:var(--text-mute);font-weight:600;font-size:.72em;margin-left:4px;text-transform:uppercase;letter-spacing:.3px;}

  .section-title{font-size:15px;font-weight:700;color:var(--text-dim);margin:0 0 16px;text-transform:uppercase;letter-spacing:.6px;}

  .hidden{display:none !important;}
  .rate-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(20px);}
  .rate-bar .rate-label{font-size:13.5px;color:var(--text-dim);}
  .rate-bar .rate-label strong{color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;}
  .search-bar{position:relative;margin-bottom:28px;max-width:480px;}
  .search-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px 14px 44px;color:var(--text);font-family:inherit;font-size:15px;transition:all .2s;backdrop-filter:blur(20px);}
  .search-bar input:focus{outline:none;border-color:var(--violet);background:rgba(139,92,246,.06);box-shadow:0 0 0 4px rgba(139,92,246,.1);}
  .search-bar input::placeholder{color:var(--text-mute);}
  .search-bar .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-mute);pointer-events:none;font-size:15px;}

  .client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;backdrop-filter:blur(20px);animation:fadeIn .3s ease backwards;}
  .client-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .client-name{font-size:19px;font-weight:800;}
  .client-pending{font-size:14px;font-weight:700;}
  .client-pending.amber{color:var(--amber);}
  .client-pending.muted{color:var(--text-mute);font-weight:600;}
  .search-total-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.08));border:1px solid rgba(139,92,246,.3);border-radius:14px;padding:14px 20px;margin-bottom:16px;font-size:13.5px;color:var(--text-dim);}
  .search-total-bar .search-total-val{font-size:17px;font-weight:800;color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;}
  .client-items{display:flex;flex-direction:column;gap:6px;}
  .client-item-row{display:grid;grid-template-columns:1fr 120px 120px auto;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.02);cursor:pointer;transition:background .15s;font-size:13.5px;}
  .client-item-row:hover{background:rgba(255,255,255,.06);}
  .ci-item{font-weight:600;}
  .ci-net,.ci-brl{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--text-dim);text-align:right;}
  .ci-brl{color:var(--text);font-weight:700;display:flex;flex-direction:column;gap:2px;}
  .ci-usd{font-size:11px;color:var(--text-mute);font-weight:600;}
  .ci-net.pos,.ci-brl.pos{color:var(--green);}
  .ci-net.neg,.ci-brl.neg{color:var(--red);}
  .ci-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .ci-badges .pill-select{pointer-events:none;padding:4px 9px;font-size:11px;}
  @media (max-width:720px){
    .client-item-row{grid-template-columns:1fr;gap:4px;}
    .ci-net,.ci-brl{text-align:left;}
  }

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;}
  .item-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;cursor:pointer;transition:all .25s ease;backdrop-filter:blur(20px);overflow:hidden;animation:fadeIn .4s ease backwards;}
  .item-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(139,92,246,.10),transparent 60%);opacity:0;transition:opacity .25s;}
  .item-card:hover{transform:translateY(-4px);border-color:rgba(139,92,246,.4);box-shadow:0 16px 40px rgba(139,92,246,.15);}
  .item-card:hover::before{opacity:1;}
  .item-card .item-name{font-size:18px;font-weight:700;margin-bottom:14px;position:relative;}
  .item-meta{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-dim);position:relative;}
  .item-meta .net{color:var(--green);font-weight:700;}
  .item-pending-badge{position:absolute;top:20px;right:20px;background:rgba(251,191,36,.15);color:var(--amber);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .item-card.new{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-style:dashed;color:var(--text-mute);min-height:120px;}
  .item-card.new:hover{color:var(--violet);border-color:var(--violet);box-shadow:none;}
  .item-card.new .plus{font-size:28px;}

  .breadcrumb{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .item-header h1{font-size:26px;margin:0;font-weight:800;}
  .item-header-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin:24px 0 16px;flex-wrap:wrap;gap:12px;}

  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;backdrop-filter:blur(20px);}
  table{border-collapse:collapse;width:100%;min-width:980px;}
  thead th{position:sticky;top:0;background:var(--bg2);color:var(--text-mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:14px 12px;border-bottom:1px solid var(--border);z-index:1;font-weight:700;}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover td{background:rgba(255,255,255,.02);}
  tbody tr.details-row:hover td{background:none;}
  tbody tr:last-child td{border-bottom:none;}

  .cell-input{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text);padding:7px 8px;font-family:inherit;font-size:13.5px;transition:all .15s;}
  .cell-input:hover{background:rgba(255,255,255,.03);}
  .cell-input:focus{outline:none;border-color:var(--violet);background:rgba(139,92,246,.08);}
  input[type=number].cell-input{appearance:textfield;-moz-appearance:textfield;}
  input[type=number].cell-input::-webkit-outer-spin-button,input[type=number].cell-input::-webkit-inner-spin-button{appearance:none;margin:0;}
  input[type=date].cell-input{font-size:12.5px;}
  .col-amount{max-width:80px;}
  .col-price{max-width:150px;}
  .cell-input.zero-warn{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08);}
  .cell-input.zero-warn:hover{background:rgba(251,191,36,.12);}
  .col-date{flex:1;min-width:0;}
  .col-customer{min-width:150px;}
  .dates-wrap{display:flex;gap:4px;}

  .computed{font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--text-dim);white-space:nowrap;}
  .computed.big{font-size:14.5px;font-weight:700;color:var(--text);}
  .computed.pos{color:var(--green);}
  .computed.neg{color:var(--red);}
  .computed.sold-complete{color:var(--green);}
  .computed.sold-partial{color:var(--amber);}
  .dual-currency{display:flex;flex-direction:column;gap:2px;}
  .dc-brl{font-size:14.5px;font-weight:700;color:var(--text);}
  .dc-brl.pos{color:var(--green);}
  .dc-brl.neg{color:var(--red);}
  .dc-usd{font-size:11.5px;font-weight:600;color:var(--text-mute);}

  .sales-empty{font-size:12.5px;color:var(--text-mute);font-style:italic;padding:8px 2px;}
  .sales-head{display:grid;grid-template-columns:130px 90px 120px 110px 30px;gap:8px;font-size:10.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.4px;padding:0 4px 4px;}
  .sales-row{display:grid;grid-template-columns:130px 90px 120px 110px 30px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;margin-bottom:6px;}
  .sales-row input{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;color:var(--text);font-family:inherit;font-size:13px;}
  .sales-row input:hover{background:rgba(255,255,255,.04);}
  .sales-row input:focus{outline:none;border-color:var(--violet);background:rgba(139,92,246,.08);}
  .sales-row .computed{font-size:12.5px;text-align:right;padding-right:6px;}
  @media (max-width:560px){
    .sales-head{display:none;}
    .sales-row{grid-template-columns:1fr 1fr;}
  }

  .pill-select{border:1px solid transparent;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;}
  .pill-select.status-in_progress{background-color:rgba(56,189,248,.14);color:#38bdf8;}
  .pill-select.status-done{background-color:rgba(52,211,153,.14);color:var(--green);}
  .pill-select.pay-pending{background-color:rgba(251,191,36,.14);color:var(--amber);}
  .pill-select.pay-paid{background-color:rgba(52,211,153,.14);color:var(--green);}

  .row-actions{display:flex;gap:6px;align-items:center;white-space:nowrap;}
  .icon-btn{background:transparent;border:none;color:var(--text-mute);cursor:pointer;padding:6px;border-radius:8px;font-size:14px;transition:all .15s;line-height:1;}
  .icon-btn:hover{background:var(--surface2);color:var(--text);}
  .icon-btn.danger:hover{color:var(--red);background:rgba(251,113,133,.1);}
  .icon-btn.rotate{transition:transform .2s;display:inline-block;}
  .icon-btn.rotate.open{transform:rotate(180deg);}
  .detail-toggle{display:inline-flex;align-items:center;gap:5px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.4);color:var(--violet);font-family:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .detail-toggle:hover{background:rgba(139,92,246,.26);border-color:var(--violet);color:#fff;}
  .detail-toggle .chev{display:inline-block;font-size:11px;transition:transform .2s;line-height:1;}
  .detail-toggle.open .chev{transform:rotate(180deg);}

  .details-row td{background:var(--bg2);padding:0;border-bottom:1px solid var(--border);}
  .details-panel{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;animation:fadeIn .25s ease;}
  .details-panel.hidden{display:none;}
  .detail-field label{display:block;font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;font-weight:600;}
  .detail-field .computed{font-size:14px;}
  .detail-field input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:13.5px;}
  .detail-field input:focus{outline:none;border-color:var(--violet);}
  .detail-field .with-btn{display:flex;gap:6px;}
  .detail-field .with-btn input{flex:1;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-mute);}
  .empty-state .big-icon{font-size:40px;margin-bottom:12px;opacity:.6;}

  .modal-overlay{position:fixed;inset:0;background:rgba(4,4,8,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .2s ease;padding:20px;}
  .modal-card{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius);padding:28px;width:440px;max-width:100%;box-shadow:var(--shadow);animation:pop .22s ease;max-height:86vh;overflow:auto;}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-card h2{margin:0 0 18px;font-size:18px;font-weight:800;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;}
  .field input:focus{outline:none;border-color:var(--violet);}
  .field .hint{font-size:11.5px;color:var(--text-mute);margin-top:5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .modal-divider{height:1px;background:var(--border);margin:22px 0;}
  .danger-zone{border:1px solid rgba(251,113,133,.25);border-radius:12px;padding:14px;background:rgba(251,113,133,.04);}
  .danger-zone p{font-size:12.5px;color:var(--text-dim);margin:0 0 10px;}

  #toastRoot{position:fixed;bottom:24px;right:24px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--panel);border:1px solid var(--border-strong);color:var(--text);padding:12px 18px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .toast.fadeout{animation:toastOut .3s ease forwards;}
  @keyframes toastOut{to{opacity:0;transform:translateY(6px);}}

  @media (max-width:640px){
    .topbar{padding:18px 20px;}
    main#app{padding:10px 16px 60px;}
    .brand-sub{display:none;}
  }
</style>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <header class="topbar">
    <div class="brand" id="brandHome">

  function defaultState(){
    return {settings:{usdBrlRate:5.30,defaultPerMillion:0.5},items:[],entries:[]};
  }
  // Normaliza entradas vindas da nuvem (garante sales[], taxRate padrão, status coerente)
  // — mesma lógica de migração que a versão local sempre teve.
  function migrateEntries(entries){
    entries.forEach(function(e){
      if(!e.sales) e.sales=[];
      if(e.taxRate==null || e.taxRate===''){ e.taxRate=DEFAULT_TAX_RATE_PCT; }
      var amt=Number(e.amount)||0;
      var soldQty=(e.sales||[]).reduce(function(sum,s){ return sum+(Number(s.qty)||0); },0);
      if(amt>0 && soldQty>=amt && e.status!=='done'){ e.status='done'; }
    });
    return entries;
  }
  var state=defaultState();
  function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }

  // ---- Conversão entre o formato do app (camelCase) e as colunas do Supabase (snake_case) ----
  function itemToRow(it, uidTarget){ return {id:it.id, user_id:uidTarget, name:it.name, created_at:it.createdAt||Date.now()}; }
  function rowToItem(r){ return {id:r.id, name:r.name, createdAt:r.created_at}; }
  function entryToRow(e, uidTarget){
    return {
      id:e.id, user_id:uidTarget, item_id:e.itemId, customer:e.customer||'',
      amount:n(e.amount), start_price:n(e.startPrice), start_date:e.startDate||'',
      sales:e.sales||[], price_per_million_usd:n(e.pricePerMillionUsd), usd_brl_rate:n(e.usdBrlRate),
      tax_rate:(e.taxRate==null?DEFAULT_TAX_RATE_PCT:n(e.taxRate)), status:e.status||'in_progress',
      payment:e.payment||'pending', notes:e.notes||''
    };
  }
  function rowToEntry(r){
    return {
      id:r.id, itemId:r.item_id, customer:r.customer||'', amount:r.amount, startPrice:r.start_price,
      startDate:r.start_date, sales:r.sales||[], pricePerMillionUsd:r.price_per_million_usd,
      usdBrlRate:r.usd_brl_rate, taxRate:r.tax_rate, status:r.status, payment:r.payment, notes:r.notes||''
    };
  }

  // ---- Carrega os dados de um login específico (o próprio, ou — se admin — o de outra pessoa) ----
  function loadCloudState(uidTarget){
    return Promise.all([
      sb.from('settings').select('*').eq('user_id',uidTarget).maybeSingle(),
      sb.from('items').select('*').eq('user_id',uidTarget).order('created_at',{ascending:true}),
      sb.from('entries').select('*').eq('user_id',uidTarget)
    ]).then(function(results){
      var settingsRes=results[0], itemsRes=results[1], entriesRes=results[2];
      var s=settingsRes.data ? {usdBrlRate:settingsRes.data.usd_brl_rate, defaultPerMillion:settingsRes.data.default_per_million} : defaultState().settings;
      state={
        settings:s,
        items:(itemsRes.data||[]).map(rowToItem),
        entries:migrateEntries((entriesRes.data||[]).map(rowToEntry))
      };
      targetUserId=uidTarget;
    });
  }

  // ---- Envia o estado atual pra nuvem (com debounce, pra não disparar uma chamada a cada tecla) ----
  var syncTimer=null;
  function saveState(){ scheduleCloudSync(); }
  function scheduleCloudSync(){
    if(isReadOnly() || !sb || !session) return;
    setCloudStatus('syncing', t('cloudSaving'));
    clearTimeout(syncTimer);
    syncTimer=setTimeout(syncToCloud, 700);
  }
  function syncToCloud(){
    if(!sb || !session || isReadOnly()) return;
    var uidTarget=session.user.id;
    var itemRows=state.items.map(function(it){ return itemToRow(it,uidTarget); });
    var entryRows=state.entries.map(function(e){ return entryToRow(e,uidTarget); });
    var itemIdList='('+state.items.map(function(it){ return '"'+it.id+'"'; }).join(',')+')';
    var entryIdList='('+state.entries.map(function(e){ return '"'+e.id+'"'; }).join(',')+')';
    var jobs=[
      sb.from('settings').upsert({user_id:uidTarget, usd_brl_rate:n(state.settings.usdBrlRate), default_per_million:n(state.settings.defaultPerMillion)}),
      itemRows.length ? sb.from('items').upsert(itemRows) : Promise.resolve({error:null}),
      entryRows.length ? sb.from('entries').upsert(entryRows) : Promise.resolve({error:null}),
      state.items.length ? sb.from('items').delete().eq('user_id',uidTarget).not('id','in',itemIdList) : sb.from('items').delete().eq('user_id',uidTarget),
      state.entries.length ? sb.from('entries').delete().eq('user_id',uidTarget).not('id','in',entryIdList) : sb.from('entries').delete().eq('user_id',uidTarget)
    ];
    Promise.all(jobs).then(function(results){
      var failed=results.some(function(r){ return r && r.error; });
      if(failed){ setCloudStatus('error', t('cloudSyncFailShort')); toast(t('toastSyncFail')); }
      else{ setCloudStatus('synced', t('cloudSaved')); }
    }).catch(function(){ setCloudStatus('error', t('cloudSyncFailShort')); toast(t('toastSyncFail')); });
  }
  function setCloudStatus(kind,text){
    var el=document.getElementById('cloudStatus'); if(el) el.className='cloud-status '+kind;
    var tx=document.getElementById('cloudStatusText'); if(tx) tx.textContent=text;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function showAuthScreen(errorMsg){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('authedHeaderActions').classList.add('hidden');
    var el=document.getElementById('authScreen');
    el.classList.remove('hidden');
    el.innerHTML=''
      + '<div class="auth-screen"><div class="auth-card">'
      + '<h1>'+t('authTitle')+'</h1>'
      + '<div class="auth-sub">'+t('authSub')+'</div>'
      + (errorMsg ? '<div class="auth-error">'+esc(errorMsg)+'</div>' : '')
      + '<div class="field"><label>'+t('authEmail')+'</label><input id="authEmail" type="email" autocomplete="username"></div>'
      + '<div class="field"><label>'+t('authPassword')+'</label><input id="authPassword" type="password" autocomplete="current-password"></div>'
      + '<button class="btn btn-primary" id="authSubmitBtn">'+t('authSubmit')+'</button>'
      + '</div></div>';
    document.getElementById('authSubmitBtn').onclick=doLogin;
    document.getElementById('authPassword').addEventListener('keydown', function(ev){ if(ev.key==='Enter') doLogin(); });
    var emailField=document.getElementById('authEmail');
    setTimeout(function(){ emailField.focus(); },50);
  }

  function doLogin(){
    if(!cloudReady || !sb){ showAuthScreen(t('authNotConfigured')); return; }
    var email=document.getElementById('authEmail').value.trim();
    var pass=document.getElementById('authPassword').value;
    if(!email || !pass) return;
    var btn=document.getElementById('authSubmitBtn');
    btn.disabled=true; btn.textContent=t('authSubmitting');
    sb.auth.signInWithPassword({email:email, password:pass}).then(function(res){
      if(res.error){ showAuthScreen(t('authWrongCreds')); return; }
      session=res.data.session;
      afterLogin();
    }).catch(function(){ showAuthScreen(t('authNoConnection')); });
  }

  function afterLogin(){
    sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle().then(function(res){
      if(res.error || !res.data){ showDeactivatedScreen(); return; }
      myProfile=res.data;
      if(!myProfile.active){ showDeactivatedScreen(); return; }
      targetUserId=session.user.id;
      var afterUsersLoaded=myProfile.is_admin ? loadAllProfiles() : Promise.resolve();
      afterUsersLoaded.then(function(){ return loadCloudState(targetUserId); }).then(function(){
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('authScreen').innerHTML='';
        document.getElementById('app').classList.remove('hidden');

  function n(v){ var x=Number(v); return isFinite(x)?x:0; }
  function fmtInt(v){ return n(v).toLocaleString('pt-BR',{maximumFractionDigits:0}); }
  function fmtNum(v,d){ d=d==null?2:d; return n(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  // Para lucros pequenos, 2 casas decimais arredondam pra "0,00" mesmo o valor sendo maior que zero.
  // Quando o valor é menor que 1 centavo, mostra com mais casas pra não sumir da tela.
  function fmtUSD(v){ var x=n(v); var d=(x!==0 && Math.abs(x)<0.01)?4:2; return 'US$ '+fmtNum(x,d); }
  function fmtBRL(v){ var x=n(v); var d=(x!==0 && Math.abs(x)<0.01)?4:2; return 'R$ '+fmtNum(x,d); }
  // Em US-EN o dólar vira a moeda principal (maior/primeira) e o real vira a secundária (entre parênteses);
  // em PT-BR é o contrário. Essas duas funções escolhem qual valor formatado vai em cada posição.
  function fmtPrimary(brl,usd){ return lang==='en' ? fmtUSD(usd) : fmtBRL(brl); }
  function fmtSecondary(brl,usd){ return lang==='en' ? fmtBRL(brl) : fmtUSD(usd); }

  function computeEntry(e){
    // O cliente já entra com o "Total compra" (seu próprio zeny), comprado de uma vez.
    // A venda pode ser dividida em várias partes (uma por dia, com preço diferente cada uma —
    // por exemplo quando o jogo limita quantos itens dá pra revender por dia).
    // A taxa do exchange do jogo é descontada em cima da venda bruta (o que o exchange paga
    // pelo item), não em cima do lucro. Depois disso é que se desconta o total compra.
    // (padrão 15%, mas editável por venda — costuma variar entre 9% e 15%).
    var amount=n(e.amount), sp=n(e.startPrice), perM=n(e.pricePerMillionUsd), rate=n(e.usdBrlRate);
    var totalStarting=amount*sp;
    var sales=e.sales||[];
    var rawIncome=0, soldQty=0;
    sales.forEach(function(s){ rawIncome += n(s.qty)*n(s.price); soldQty += n(s.qty); });
    var income=rawIncome-totalStarting;
    var taxRatePct=(e.taxRate==null || e.taxRate==='')?DEFAULT_TAX_RATE_PCT:n(e.taxRate);
    var taxExchange=rawIncome*(taxRatePct/100);
    var netProfit=income-taxExchange;
    var priceUSD=(netProfit/1000000)*perM;
    var priceBRL=priceUSD*rate;
    return {totalStarting:totalStarting, rawIncome:rawIncome, income:income, taxRatePct:taxRatePct, taxExchange:taxExchange, netProfit:netProfit, priceUSD:priceUSD, priceBRL:priceBRL, soldQty:soldQty};
  }

  function itemEntries(itemId){ return state.entries.filter(function(e){ return e.itemId===itemId; }); }
  function itemSummary(itemId){
    var list=itemEntries(itemId);
    var netSum=0, pendBRL=0, pendUSD=0, pendCount=0;
    list.forEach(function(e){
      var c=computeEntry(e);
      netSum+=c.netProfit;
      if(e.status==='done' && e.payment==='pending'){ pendBRL+=c.priceBRL; pendUSD+=c.priceUSD; pendCount++; }
    });
    return {count:list.length, net:netSum, pendBRL:pendBRL, pendUSD:pendUSD, pendCount:pendCount};
  }

  function toast(msg){
    var root=document.getElementById('toastRoot');
    var el=document.createElement('div');
    el.className='toast';

  }

  function computeClientMatches(query){
    var q=query.trim().toLowerCase();
    if(!q) return [];
    var byClient={};
    state.entries.forEach(function(e){
      if(!e.customer || e.customer.toLowerCase().indexOf(q)===-1) return;
      var key=e.customer;
      if(!byClient[key]) byClient[key]={name:e.customer, items:[], pendingBRL:0, pendingUSD:0, netTotal:0};
      var item=state.items.find(function(i){ return i.id===e.itemId; });
      var c=computeEntry(e);
      byClient[key].items.push({itemName:item?item.name:t('itemRemoved'), itemId:e.itemId, netProfit:c.netProfit, priceBRL:c.priceBRL, priceUSD:c.priceUSD, status:e.status, payment:e.payment});
      byClient[key].netTotal+=c.netProfit;
      if(e.status==='done' && e.payment==='pending'){ byClient[key].pendingBRL+=c.priceBRL; byClient[key].pendingUSD+=c.priceUSD; }
    });
    return Object.keys(byClient).map(function(k){ return byClient[k]; }).sort(function(a,b){ return b.pendingBRL-a.pendingBRL; });
  }

  function renderSearchResults(query){
    var results=document.getElementById('searchResults');
    var itemsSection=document.getElementById('itemsSection');
    if(!results || !itemsSection) return;
    if(!query.trim()){
      results.classList.add('hidden'); results.innerHTML='';
      itemsSection.classList.remove('hidden');
      return;
    }
    itemsSection.classList.add('hidden');
    results.classList.remove('hidden');
    var matches=computeClientMatches(query);
    if(matches.length===0){
      results.innerHTML='<div class="empty-state"><div class="big-icon">🔍</div>'+t('noClientFoundPrefix')+esc(query)+'".</div>';
      return;
    }
    var totalBRL=0, totalUSD=0;
    matches.forEach(function(m){ totalBRL+=m.pendingBRL; totalUSD+=m.pendingUSD; });
    var totalBar = matches.length>1
      ? '<div class="search-total-bar"><span>'+t('searchTotalPrefix')+matches.length+t('searchTotalSuffix')+'</span><span class="search-total-val">'+fmtPrimary(totalBRL,totalUSD)+' <span class="usd-inline">('+fmtSecondary(totalBRL,totalUSD)+')</span></span></div>'
      : '';
    results.innerHTML=totalBar+matches.map(function(m,i){
      return '<div class="client-card" style="animation-delay:'+(i*0.04)+'s">'
        + '<div class="client-card-head"><div class="client-name">'+esc(m.name)+'</div>'
        + '<div class="client-pending '+(m.pendingBRL>0?'amber':'muted')+'">'+(m.pendingBRL>0?t('clientPendingPrefix')+fmtPrimary(m.pendingBRL,m.pendingUSD)+' <span class="usd-inline">('+fmtSecondary(m.pendingBRL,m.pendingUSD)+')</span>':t('noPending'))+'</div></div>'
        + '<div class="client-items">'

            var netClass=it.netProfit>=0?'pos':'neg';

              + '</div>';
          }).join('')

    return ''

    + '<td><input class="cell-input col-amount'+(amt===0?' zero-warn':'')+'" type="number" step="any" data-field="amount" value="'+e.amount+'" title="'+(amt===0?esc(t('zeroWarnTitle')):'')+'"'+dis+'></td>'

    + '<td><input class="cell-input col-date" type="date" data-field="startDate" value="'+(e.startDate||'')+'"'+dis+'></td>'
    + '<td class="computed '+soldClass+'" data-calc="soldQty">'+c.soldQty+'/'+fmtInt(amt)+'</td>'

    + '<td><select class="pill-select status-'+e.status+'" data-field="status"'+dis+'>'

    + '</select></td>'
    + '<td><select class="pill-select pay-'+e.payment+'" data-field="payment"'+dis+'>'
    +   '<option value="pending" '+(e.payment==='pending'?'selected':'')+'>'+t('paymentPending')+'</option>'

  function updateRowComputed(id){
    var entry=state.entries.find(function(x){ return x.id===id; });
    if(!entry) return;
    var c=computeEntry(entry);
    var amt=n(entry.amount);
    // Automação: se já foi vendido tudo que foi comprado, marca como concluído sozinho.
    var autoCompleted=false;
    if(amt>0 && c.soldQty>=amt && entry.status!=='done'){
      entry.status='done';
      autoCompleted=true;
      saveState();
    }
    var tr=document.querySelector('tr[data-id="'+id+'"]:not(.details-row)');
    if(tr){
      var netCell=tr.querySelector('[data-calc="netProfit"]');
      if(netCell){ netCell.innerHTML=fmtInt(c.netProfit)+' <span class="zeny-unit">zeny</span>'; netCell.classList.toggle('pos', c.netProfit>=0); netCell.classList.toggle('neg', c.netProfit<0); }
      var brlCell=tr.querySelector('[data-calc="priceBRL"]');
      if(brlCell){
        var brlSpan=brlCell.querySelector('[data-calc-sub="brl"]');
        var usdSpan=brlCell.querySelector('[data-calc-sub="usd"]');
        if(brlSpan){ brlSpan.textContent=fmtPrimary(c.priceBRL,c.priceUSD); brlSpan.classList.toggle('pos', c.netProfit>=0); brlSpan.classList.toggle('neg', c.netProfit<0); }
        if(usdSpan){ usdSpan.textContent=fmtSecondary(c.priceBRL,c.priceUSD); }
      }
      var qtyInput=tr.querySelector('input[data-field="amount"]');
      if(qtyInput){
        var isZero=amt===0;
        qtyInput.classList.toggle('zero-warn', isZero);
        qtyInput.title=isZero?t('zeroWarnTitle'):'';
      }
      var soldCell=tr.querySelector('[data-calc="soldQty"]');
      if(soldCell){
        soldCell.textContent=c.soldQty+'/'+fmtInt(amt);
        soldCell.classList.toggle('sold-complete', amt>0 && c.soldQty>=amt);
        soldCell.classList.toggle('sold-partial', amt>0 && c.soldQty<amt);
      }
      if(autoCompleted){
        var statusSel=tr.querySelector('select[data-field="status"]');
        if(statusSel){ statusSel.value='done'; statusSel.className='pill-select status-done'; }
      }
    }
    var dr=document.querySelector('tr.details-row[data-details="'+id+'"]');
    if(dr){
      var map={totalStarting:fmtInt(c.totalStarting),rawIncome:fmtInt(c.rawIncome),income:fmtInt(c.income),taxExchange:fmtInt(c.taxExchange)+' zeny',priceUSD:fmtUSD(c.priceUSD)};
      Object.keys(map).forEach(function(k){
        var el=dr.querySelector('[data-calc="'+k+'"]');
        if(el) el.textContent=map[k];
      });
    }
    if(autoCompleted) toast(t('toastAutoDone'));
    updateItemStatsBar();
  }

  function fetchUsdBrl(){
    return fetch('https://economia.awesomeapi.com.br/last/USD-BRL').then(function(res){
      if(!res.ok) throw new Error('http '+res.status);
      return res.json();
    }).then(function(data){
      var bid=parseFloat(data.USDBRL && data.USDBRL.bid);
      if(!isFinite(bid)) throw new Error('parse fail');
      return bid;
    });
  }
  function fetchRateForSettings(){
    fetchUsdBrl().then(function(rate){
      var el=document.getElementById('setRate');
      if(el) el.value=rate.toFixed(4);
      toast(t('toastRateUpdatedPrefix')+fmtNum(rate,4));
    }).catch(function(){ toast(t('toastRateFail')); });
  }
  function updateAllPendingRates(){
    fetchUsdBrl().then(function(rate){
      state.settings.usdBrlRate=rate;
      var count=0;
      state.entries.forEach(function(e){
        if(e.payment==='pending'){ e.usdBrlRate=rate; count++; }
      });
      saveState();
      render();
      toast(count>0
        ? (lang==='en'
            ? 'Rate '+fmtNum(rate,4)+' applied to '+count+' pending charge'+(count>1?'s':'')+'.'
            : 'Cotação '+fmtNum(rate,4)+' aplicada em '+count+' cobrança'+(count>1?'s':'')+' pendente'+(count>1?'s':'')+'.')
        : (lang==='en'
            ? 'Default rate updated to '+fmtNum(rate,4)+' (no pending charges right now).'
            : 'Cotação padrão atualizada para '+fmtNum(rate,4)+' (nenhuma cobrança pendente no momento).'));
    }).catch(function(){ toast(t('toastRateFail')); });
  }
  function fetchRateInto(btn){
    var field=btn.closest('.detail-field').querySelector('input');
    var tr=btn.closest('tr[data-id]');
    if(!tr) return;
    var id=tr.dataset.id;
    fetchUsdBrl().then(function(rate){
      field.value=rate.toFixed(4);
      var entry=state.entries.find(function(x){ return x.id===id; });
      if(entry){ entry.usdBrlRate=rate; saveState(); updateRowComputed(id); }
      toast(t('toastRateUpdatedPrefix')+fmtNum(rate,4));
    }).catch(function(){ toast(t('toastRateFail')); });
  }

  function exportBackup(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='zenybus-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(t('toastBackupExported'));
  }
  function handleImportFile(ev){
    var file=ev.target.files[0];
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var parsed=JSON.parse(reader.result);
        if(!parsed.items || !parsed.entries) throw new Error('formato inválido');
        state={settings:Object.assign(defaultState().settings, parsed.settings||{}), items:parsed.items, entries:parsed.entries};
        saveState(); closeModal(); go({name:'dashboard'}); toast(t('toastBackupImported'));
      }catch(e){ toast(t('toastInvalidFile')); }
    };
    reader.readAsText(file);
    ev.target.value='';
  }

  function exportItemCSV(){
    var item=state.items.find(function(i){ return i.id===view.id; });
    var entries=itemEntries(view.id);
    var header=lang==='en'
      ? ['Client','Number of Items','Buy Price','Total Buy','Buy Date','Sales (date:qty@price)','Gross Revenue','In-game Profit','Exchange Fee (%)','Exchange Fee Amount','Net Profit','US$ per Million','USD Value','Rate','BRL Value','Status','Payment']
      : ['Cliente','Numero de Itens','Preco Compra','Total Compra','Data Compra','Vendas (data:qtd@preco)','Receita Bruta','Lucro Jogo','Taxa Exchange (%)','Valor Taxa Exchange','Lucro Liquido','US$ por Milhao','Valor USD','Cotacao','Valor BRL','Status','Pagamento'];
    var lines=[header.join(';')];
    entries.forEach(function(e){
      var c=computeEntry(e);
      var salesStr=(e.sales||[]).map(function(s){
        var d=s.date? s.date.split('-').reverse().slice(0,2).join('/') : '?';
        return d+':'+s.qty+'@'+s.price;
      }).join(' | ');
      var statusStr=lang==='en' ? (e.status==='done'?'Done':'In progress') : (e.status==='done'?'Concluido':'Em andamento');
      var paymentStr=lang==='en' ? (e.payment==='paid'?'Paid':'Pending') : (e.payment==='paid'?'Pago':'Pendente');
      var row=[e.customer,e.amount,e.startPrice,c.totalStarting,e.startDate||'',salesStr,c.rawIncome,c.income,c.taxRatePct,c.taxExchange,c.netProfit,e.pricePerMillionUsd,c.priceUSD.toFixed(4),e.usdBrlRate,c.priceBRL.toFixed(4), statusStr, paymentStr];
      lines.push(row.map(function(v){ return String(v).replace(/;/g,','); }).join(';'));
    });
    var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=(item.name||'item')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(t('toastCsvExported'));
  }

    var langBtn=t.closest('[data-lang]'); if(langBtn) return setLang(langBtn.dataset.lang);
    if(t.closest('#brandHome')) return go({name:'dashboard'});
    if(t.closest('#addItemCard')) return openAddItemModal();

    if(t.closest('#addEntryBtn')) return addEntry();
    if(t.closest('#renameItemBtn')) return renameItem();
    if(t.closest('#deleteItemBtn')) return confirmDeleteItem();
    if(t.closest('#csvItemBtn')) return exportItemCSV();
    if(t.closest('#btnSettings')) return openSettingsModal();
    if(t.closest('#btnLogout')) return doLogout();
    if(t.closest('#btnUsers')) return openUsersModal();
    if(t.closest('#updateAllRatesBtn')) return updateAllPendingRates();
    if(t.closest('[data-action="backToMyPanel"]')) return backToMyPanel();

    var viewUserBtn=t.closest('[data-action="viewUserData"]');
    if(viewUserBtn) return viewUserData(viewUserBtn.dataset.userId);
    var toggleUserBtn=t.closest('[data-action="toggleUserActive"]');
    if(toggleUserBtn) return toggleUserActive(toggleUserBtn.dataset.userId, toggleUserBtn.dataset.next==='true');

    var expandBtn=t.closest('[data-action="expand"]');
    if(expandBtn){
      var tr=expandBtn.closest('tr');
      var id=tr.dataset.id;
      var detailsRow=document.querySelector('tr.details-row[data-details="'+id+'"]');
      var panel=detailsRow.querySelector('.details-panel');
      panel.classList.toggle('hidden');
      expandBtn.classList.toggle('open');
      return;
    }
    var delBtn=t.closest('[data-action="delete"]');
    if(delBtn){ var tr2=delBtn.closest('tr'); return confirmDeleteEntry(tr2.dataset.id); }

    var fetchBtn=t.closest('[data-action="fetchRate"]');
    if(fetchBtn) return fetchRateInto(fetchBtn);
    if(t.closest('[data-action="fetchRateSettings"]')) return fetchRateForSettings();
    if(t.closest('[data-modal-close]')) return closeModal();

    var gotoRow=t.closest('[data-goto-item]');
    if(gotoRow) return go({name:'item', id:gotoRow.dataset.gotoItem});

    var addSaleBtn=t.closest('[data-action="addSale"]');
    if(addSaleBtn){
      var drA=addSaleBtn.closest('tr.details-row[data-id]');
      if(!drA) return;
      var entA=state.entries.find(function(x){ return x.id===drA.dataset.id; });
      if(!entA) return;
      if(!entA.sales) entA.sales=[];
      var newSale={id:uid(), date:todayStr(), qty:0, price:0};
      entA.sales.push(newSale);
      saveState();
      var contA=drA.querySelector('[data-sales-container]');
      if(contA) contA.innerHTML=salesBlockHTML(entA);
      updateRowComputed(entA.id);
      var newQtyInput=drA.querySelector('.sales-row[data-sale-id="'+newSale.id+'"] input[data-sale-field="qty"]');
      if(newQtyInput) newQtyInput.focus();
      return;
    }
    var delSaleBtn=t.closest('[data-action="deleteSale"]');
    if(delSaleBtn){
      var drD=delSaleBtn.closest('tr.details-row[data-id]');
      if(!drD) return;
      var entD=state.entries.find(function(x){ return x.id===drD.dataset.id; });
      if(!entD) return;
      entD.sales=(entD.sales||[]).filter(function(s){ return s.id!==delSaleBtn.dataset.saleId; });
      saveState();
      var contD=drD.querySelector('[data-sales-container]');
      if(contD) contD.innerHTML=salesBlockHTML(entD);
      updateRowComputed(entD.id);
      return;
    }
  });

  document.addEventListener('input', function(ev){
    var t=ev.target;
    if(t.id==='clientSearch'){ renderSearchResults(t.value); return; }

    if(t.dataset && t.dataset.saleField){
      var saleRow=t.closest('.sales-row');
      var drS=t.closest('tr.details-row[data-id]');
      if(!saleRow || !drS) return;
      var entS=state.entries.find(function(x){ return x.id===drS.dataset.id; });
      if(!entS || !entS.sales) return;
      var sale=entS.sales.find(function(s){ return s.id===saleRow.dataset.saleId; });
      if(!sale) return;
      var sf=t.dataset.saleField;
      sale[sf]= sf==='date' ? t.value : (t.value===''?0:parseFloat(t.value));
      saveState();
      var subtotalEl=saleRow.querySelector('[data-sale-calc="subtotal"]');
      if(subtotalEl) subtotalEl.textContent=fmtInt(n(sale.qty)*n(sale.price));
      updateRowComputed(entS.id);
      return;
    }

    if(!t.dataset || !t.dataset.field) return;
    var tr=t.closest('tr[data-id]');
    if(!tr) return;
    var id=tr.dataset.id;
    var entry=state.entries.find(function(x){ return x.id===id; });
    if(!entry) return;
    var field=t.dataset.field;
    var numericFields=['amount','startPrice','pricePerMillionUsd','usdBrlRate','taxRate'];
    if(numericFields.indexOf(field)!==-1){
      var numVal= t.value===''?0:parseFloat(t.value);
      entry[field]= (field==='taxRate') ? Math.round(numVal) : numVal;
    } else {
      entry[field]=t.value;
    }
    saveState();
    updateRowComputed(id);
  });

  document.addEventListener('change', function(ev){
    var t=ev.target;
    if(t.tagName==='SELECT' && t.dataset.field){
      var tr=t.closest('tr[data-id]');
      if(!tr) return;
      var id=tr.dataset.id;
      var entry=state.entries.find(function(x){ return x.id===id; });
      if(!entry) return;
      entry[t.dataset.field]=t.value;
      saveState();
      if(t.dataset.field==='status') t.className='pill-select status-'+t.value;
      if(t.dataset.field==='payment') t.className='pill-select pay-'+t.value;
      updateItemStatsBar();
    }
  });

  document.addEventListener('focus', function(ev){

    if(t.matches && t.matches('input[type=number]')) t.select();

  // ============================================================
  // Inicialização: verifica se já existe uma sessão salva antes
  // de mostrar a tela de login.
  // ============================================================
  function boot(){
    if(!cloudReady || !sb){
      showAuthScreen(t('authNotConfigured'));
      return;
    }
    sb.auth.getSession().then(function(res){
      var sess=res && res.data && res.data.session;
      if(sess){
        session=sess;
        afterLogin();
      } else {
        showAuthScreen();
      }
    }).catch(function(){ showAuthScreen(t('authNoConnection')); });

    sb.auth.onAuthStateChange(function(event){
      if(event==='SIGNED_OUT'){
        session=null; myProfile=null; allProfiles=[]; targetUserId=null;
        state=defaultState();
        showAuthScreen();
      }
    });
  }
  boot();
})();
</script>
</body>
</html>
